# ruff.toml
# ------------------------------
#
# Pénzügyi Napló - Ruff konfiguráció.
#
# Enélkül a Ruff csak az alapértelmezett E (pycodestyle) + F (Pyflakes)
# szabályokat futtatja - ez a fájl explicitté teszi ezt, és néhány
# hasznos, alacsony zajszintű kategóriával bővíti.

line-length = 100
target-version = "py313"

[lint]
select = [
    "E",    # pycodestyle hibák
    "F",    # Pyflakes (unused import/var, stb. - ezt láttuk élesben)
    "I",    # isort - import-sorrend és -csoportosítás
    "UP",   # pyupgrade - elavult Python-szintaxis modernizálása
    "B",    # flake8-bugbear - gyakori, valódi hibalehetőségek
    "SIM",  # flake8-simplify - feleslegesen bonyolult kód egyszerűsítése
]

# Egyelőre nincs ignore-olt szabály - ha egy konkrét szabály túl zajosnak
# bizonyul egy adott mintára (pl. a projekt szándékosan használ valamit,
# amit a bugbear hibának jelezne), ide kerülhet, indoklással a sor felett.
ignore = []

[lint.isort]
# A projekt saját csomagja külön blokkban legyen az importoknál.
known-first-party = ["penzugyi_naplo"]
