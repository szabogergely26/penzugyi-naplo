name: Build DEB package

on:
  push:
    branches:
      - main
      - Preview
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # main    -> stable build script  -> penzugyi-naplo.deb
      # Preview -> preview build script -> penzugyi-naplo-preview.deb
      - name: Determine build script from branch
        id: build
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "script=packaging/deb/build_deb.sh" >> "$GITHUB_OUTPUT"
            echo "artifact_name=penzugyi-naplo-deb" >> "$GITHUB_OUTPUT"
          else
            echo "script=packaging/deb/build_deb_preview.sh" >> "$GITHUB_OUTPUT"
            echo "artifact_name=penzugyi-naplo-preview-deb" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot rsync desktop-file-utils

      - name: Make build script executable
        run: |
          chmod +x ${{ steps.build.outputs.script }}

      - name: Build deb package
        run: |
          ./${{ steps.build.outputs.script }}

      - name: Collect deb artifact
        run: |
          mkdir -p artifacts
          find . -type f -name "*.deb" -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.deb' -print -quit)"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: artifacts/*.deb
